<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ingreso | Control de Tiempos BIA</title>
  <style>
    :root{--p:#173b63;--p2:#0f6aa8;--bg:#eef4f9;--card:#fff;--danger:#b42318;--muted:#667085}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e8f1f8,#f7fafc);min-height:100vh;display:grid;place-items:center;color:#1d2939}
    .card{width:min(430px,92vw);background:var(--card);border-radius:22px;padding:30px;box-shadow:0 20px 60px rgba(23,59,99,.18)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-weight:900}
    h1{font-size:24px;margin:0;color:var(--p)}p{color:var(--muted);margin:5px 0 22px}
    label{display:block;font-weight:700;font-size:13px;margin:13px 0 6px}
    input{width:100%;padding:12px 13px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}
    button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--p2);color:#fff;font-weight:800;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}.msg{min-height:20px;margin-top:13px;font-size:13px}.error{color:var(--danger)}.ok{color:#067647}
    .small{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
  
.network{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.network.online{background:#dcfae6;color:#067647}.network.offline{background:#fee4e2;color:#b42318}.install-btn{background:#fff;color:#173b63;border:1px solid #d0d5dd;margin:0;width:auto}.update-bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#173b63;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 30px #0004;text-align:center}.update-bar button{margin-left:10px;background:#fff;color:#173b63;width:auto;padding:7px 11px}
</style>

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#173b63">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">BIA</div><div><h1>Control de Tiempos</h1><p style="margin:3px 0 0">Operaciones de agencia</p></div></div>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" required placeholder="usuario@empresa.com">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      <button id="btnLogin" type="submit">Iniciar sesión</button>
      <div id="mensaje" class="msg"></div>
    </form>
    <div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:15px"><span id="networkStatus" class="network"></span><button id="installApp" class="install-btn" type="button" hidden>Instalar app</button></div><div class="small">Acceso protegido mediante Supabase Auth.</div>
  </main>
  <script type="module">
    import { iniciarSesion, obtenerSesion } from './supabase-config.js';

    const actual = await obtenerSesion();
    if(actual.ok && actual.session) location.replace('./cronometros.html');

    const form=document.getElementById('loginForm');
    const msg=document.getElementById('mensaje');
    const btn=document.getElementById('btnLogin');

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      msg.textContent=''; btn.disabled=true; btn.textContent='Validando...';
      const result=await iniciarSesion(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
      );
      btn.disabled=false; btn.textContent='Iniciar sesión';
      if(!result.ok){
        msg.className='msg error';
        msg.textContent='Usuario o contraseña incorrectos.';
        return;
      }
      msg.className='msg ok'; msg.textContent='Acceso correcto.';
      location.replace('./cronometros.html');
    });
  </script>
  <script src="./pwa.js" defer></script>
</body>
</html>
